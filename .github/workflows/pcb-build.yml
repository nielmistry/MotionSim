name: PCB Build and Artifacts

on:
  pull_request:
    branches: [ pcb ]
    paths:
      - 'MotionSimPCB/**'
      - '.github/workflows/pcb-build.yml'      
  workflow_dispatch:

jobs:
  build-pcb:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Docker for KiCad
      run: |
        docker pull kicad/kicad:9.0
        
    - name: Create output directories
      run: |
        mkdir -p assets/pdfs
        mkdir -p assets/gerbers
        mkdir -p assets/drill
        chmod -R 777 assets
        
    - name: Setup KiCad environment
      run: |
        mkdir -p /tmp/kicad-home/.cache
        mkdir -p /tmp/kicad-home/.config/kicad/9.0
        chmod -R 777 /tmp/kicad-home
        
    - name: Generate PDFs from Schematics
      run: |
        set +e  # Don't exit on error
        
        # Try to generate PDF for main schematic
        docker run --rm \
          -e HOME=/tmp/kicad-home \
          -v "/tmp/kicad-home:/tmp/kicad-home" \
          -v "$PWD:/workspace" \
          -w /workspace \
          kicad/kicad:9.0 \
          sh -c "kicad-cli sch export pdf MotionSimPCB/MotionSimPCB.kicad_sch && mv MotionSimPCB.pdf assets/pdfs/MotionSimPCB-schematic.pdf" 2>/dev/null
          
        # If that failed, check for existing PDF and copy it
        if [ ! -f "assets/pdfs/MotionSimPCB-schematic.pdf" ]; then
          echo "KiCad PDF generation failed, checking for existing PDFs..."
          if [ -f "MotionSimPCB/pdfs/MotionSimPCB.pdf" ]; then
            echo "Found existing PDF, copying..."
            cp "MotionSimPCB/pdfs/MotionSimPCB.pdf" "assets/pdfs/MotionSimPCB-schematic.pdf"
          else
            echo "No existing PDF found, creating placeholder"
            echo "PDF generation failed - see source files in PCB directory" > "assets/pdfs/PDF_GENERATION_FAILED.txt"
          fi
        fi
          
        # Try to generate PDF for controllers schematic - similar fallback approach
        docker run --rm \
          -e HOME=/tmp/kicad-home \
          -v "/tmp/kicad-home:/tmp/kicad-home" \
          -v "$PWD:/workspace" \
          -w /workspace \
          kicad/kicad:9.0 \
          sh -c "kicad-cli sch export pdf MotionSimPCB/controllers.kicad_sch && mv controllers.pdf assets/pdfs/controllers-schematic.pdf" 2>/dev/null
          
        if [ ! -f "assets/pdfs/controllers-schematic.pdf" ]; then
          echo "Controllers schematic PDF generation failed or not available"
          echo "Controllers schematic PDF generation failed - see source .kicad_sch files" > "assets/pdfs/controllers-schematic-FAILED.txt"
        fi
        
        set -e  # Re-enable exit on error
          
    - name: Generate PCB PDF
      run: |
        # Try to generate PCB PDF - if it fails, we'll note it but continue
        docker run --rm \
          -e HOME=/tmp/kicad-home \
          -v "/tmp/kicad-home:/tmp/kicad-home" \
          -v "$PWD:/workspace" \
          -w /workspace \
          kicad/kicad:9.0 \
          sh -c "kicad-cli pcb export pdf --layers 'F.Cu,B.Cu,F.Silkscreen,B.Silkscreen,Edge.Cuts' MotionSimPCB/MotionSimPCB.kicad_pcb && mv MotionSimPCB.pdf assets/pdfs/MotionSimPCB-pcb.pdf" || echo "PCB PDF generation failed, skipping"
          
    - name: Generate Gerber Files
      run: |
        set +e  # Don't exit on error
        
        # Try to generate Gerbers
        docker run --rm \
          -e HOME=/tmp/kicad-home \
          -v "/tmp/kicad-home:/tmp/kicad-home" \
          -v "$PWD:/workspace" \
          -w /workspace \
          kicad/kicad:9.0 \
          sh -c "kicad-cli pcb export gerbers --layers 'F.Cu,B.Cu,F.Paste,B.Paste,F.Silkscreen,B.Silkscreen,F.Mask,B.Mask,Edge.Cuts' MotionSimPCB/MotionSimPCB.kicad_pcb && mv MotionSimPCB-*.g* assets/gerbers/ 2>/dev/null || true"
          
        # Check if Gerbers were generated, if not create instructional file
        if [ ! "$(ls -A assets/gerbers/ 2>/dev/null)" ]; then
          echo "Gerber generation failed in CI environment" > assets/gerbers/GERBER_GENERATION_FAILED.txt
          echo "To generate Gerbers manually:" >> assets/gerbers/GERBER_GENERATION_FAILED.txt
          echo "1. Open MotionSimPCB/MotionSimPCB.kicad_pcb in KiCad" >> assets/gerbers/GERBER_GENERATION_FAILED.txt
          echo "2. Go to File > Fabrication Outputs > Gerbers" >> assets/gerbers/GERBER_GENERATION_FAILED.txt
          echo "3. Select layers and generate" >> assets/gerbers/GERBER_GENERATION_FAILED.txt
        fi
          
        set -e  # Re-enable exit on error
          
    - name: Generate Drill Files
      run: |
        set +e  # Don't exit on error
        
        # Try to generate drill files
        docker run --rm \
          -e HOME=/tmp/kicad-home \
          -v "/tmp/kicad-home:/tmp/kicad-home" \
          -v "$PWD:/workspace" \
          -w /workspace \
          kicad/kicad:9.0 \
          sh -c "kicad-cli pcb export drill --format excellon MotionSimPCB/MotionSimPCB.kicad_pcb && mv MotionSimPCB*.drl assets/drill/ 2>/dev/null || true"
          
        # Check if drill files were generated  
        if [ ! "$(ls -A assets/drill/ 2>/dev/null)" ]; then
          echo "Drill file generation failed in CI environment" > assets/drill/DRILL_GENERATION_FAILED.txt
          echo "To generate drill files manually:" >> assets/drill/DRILL_GENERATION_FAILED.txt
          echo "1. Open MotionSimPCB/MotionSimPCB.kicad_pcb in KiCad" >> assets/drill/DRILL_GENERATION_FAILED.txt  
          echo "2. Go to File > Fabrication Outputs > Drill Files" >> assets/drill/DRILL_GENERATION_FAILED.txt
          echo "3. Generate drill files" >> assets/drill/DRILL_GENERATION_FAILED.txt
        fi
        
        set -e  # Re-enable exit on error
          
    - name: List generated files
      run: |
        echo "Generated files:"
        find assets -type f -name "*" | sort
        
    - name: Upload PDF artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pcb-pdfs
        path: assets/pdfs/
        retention-days: 30
        
    - name: Upload Gerber artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pcb-gerbers
        path: assets/gerbers/
        retention-days: 30
        
    - name: Upload Drill artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pcb-drill-files
        path: assets/drill/
        retention-days: 30
        
    - name: Create ZIP package for manufacturing
      run: |
        # Create manufacturing package from whatever files we have
        cd assets
        
        # If we have generated gerbers and drill files, package them
        if [ "$(ls -A gerbers/ 2>/dev/null)" ] && [ "$(ls -A drill/ 2>/dev/null)" ]; then
          echo "Creating manufacturing package with generated files..."
          zip -r ../MotionSimPCB-manufacturing-files.zip gerbers/ drill/
        else
          echo "No generated manufacturing files, creating instructional package..."
          mkdir -p ../manufacturing-instructions
          echo "# Manufacturing Files Generation Failed" > ../manufacturing-instructions/README.md
          echo "" >> ../manufacturing-instructions/README.md  
          echo "The automated generation of Gerber and drill files failed in the CI environment." >> ../manufacturing-instructions/README.md
          echo "To generate manufacturing files manually:" >> ../manufacturing-instructions/README.md
          echo "" >> ../manufacturing-instructions/README.md
          echo "1. Install KiCad (version 9.0 or compatible)" >> ../manufacturing-instructions/README.md
          echo "2. Open MotionSimPCB/MotionSimPCB.kicad_pcb" >> ../manufacturing-instructions/README.md
          echo "3. Generate Gerbers: File > Fabrication Outputs > Gerbers" >> ../manufacturing-instructions/README.md
          echo "4. Generate Drill Files: File > Fabrication Outputs > Drill Files" >> ../manufacturing-instructions/README.md
          echo "5. Package the .gbr and .drl files for your PCB manufacturer" >> ../manufacturing-instructions/README.md
          
          # Copy the source PCB file for reference
          cp ../MotionSimPCB/MotionSimPCB.kicad_pcb ../manufacturing-instructions/
          cp ../MotionSimPCB/MotionSimPCB.kicad_pro ../manufacturing-instructions/
          
          zip -r ../MotionSimPCB-manufacturing-files.zip ../manufacturing-instructions/
        fi
        
        cd ..
        
    - name: Upload Manufacturing Package
      uses: actions/upload-artifact@v4
      with:
        name: manufacturing-package
        path: MotionSimPCB-manufacturing-files.zip
        retention-days: 30

    - name: Comment on PR with artifact links
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const pullNumber = context.payload.pull_request.number;
          const runId = context.runId;
          
          const comment = `## 🔧 PCB Build Artifacts Generated
          
          The PCB files have been processed and the following artifacts are available for download:
          
          ### 📄 PDFs
          - [PCB Schematics & Layout PDFs](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts) - Contains schematic and PCB layout PDFs
          
          ### 🏭 Manufacturing Files
          - [Gerber Files](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts) - PCB manufacturing files
          - [Drill Files](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts) - Drill files for PCB fabrication
          - [Complete Manufacturing Package](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts) - ZIP package ready for PCB manufacturer
          
          ### 📦 All Artifacts
          You can download all artifacts from the [GitHub Actions run](https://github.com/${owner}/${repo}/actions/runs/${runId}).
          
          ---
          *Generated automatically by PCB Build workflow*`;
          
          github.rest.issues.createComment({
            owner,
            repo,
            issue_number: pullNumber,
            body: comment
          });